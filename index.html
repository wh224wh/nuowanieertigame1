<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>诺瓦涅尔缇 · 研究所迷宫 回合战斗</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#070709;font-family:system-ui}
canvas{display:block;image-rendering:pixelated;}

#updateNote{
    width: 100%;
    max-width: 320px;
    overflow: hidden;
    white-space: nowrap;
    margin-top: 8px;
    color: #88a8bb;
    font-size: 12px;
    text-shadow: 0 0 3px #000;
    letter-spacing: 1px;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent);
}
#updateNoteInner{
    display: inline-block;
    animation: scrollNote 7s linear infinite;
}
@keyframes scrollNote{
    0%{ transform: translateX(100%); }
    100%{ transform: translateX(-100%); }
}
#updateNoteInner{
    display: inline-block;
    animation: scrollNote 10s linear infinite;
}
@ scrollNote{
    0%{ transform: translateX(-100%); }
    100%{ transform: translateX(100%); }
}

#startScreen{
    position: fixed;
    inset: 0;
    background: #050508;
    z-index: 300;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    color: #d8e2ec;
}
#startScreen h1{
    font-weight: normal;
    letter-spacing: 6px;
    font-size: 26px;
}
#startScreen p{
    color: #778899;
    font-size: 14px;
}
#startBtn{
    padding: 16px 42px;
    font-size: 18px;
    border: 1px solid #446080;
    background: #0f1520;
    color: #cad8e8;
    border-radius: 8px;
}
#startBtn:active{ background: #1b2638; }

#joystick{
    position:fixed;
    left:40px;
    bottom:40px;
    width:140px;
    height:140px;
    border-radius:50%;
    background:rgba(40,40,50,0.4);
    touch-action:none;
    z-index:10;
    display:none;
}
#stick{
    position:absolute;
    width:60px;
    height:60px;
    border-radius:50%;
    background:rgba(120,140,180,0.6);
    left:40px;
    top:40px
}
#ui{
    #levelText{ color:#ffd266; font-weight:bold; }
    position:fixed; top:12px; left:12px;
    color:#eee; font-size:13px;
    text-shadow:0 0 4px #000; z-index:10;
    background:rgba(0,0,0,0.4);
    padding:4px 8px;
    border-radius:4px;
}
#equipUI{
    position:fixed;
    top: 40px;
    left: 12px;
    color:#bcc8da;
    font-size: 13px;
    z-index: 10;
    line-height: 1.6;
    max-width: 340px;
}
#bagUI{
    position:fixed;
    top: 90px;
    left: 12px;
    color:#bcc8da;
    font-size: 13px;
    z-index: 10;
    line-height: 1.6;
    max-width:340px;
}

/* ===== 饰品切换面板 ===== */
#apToggle{

    position:fixed; top:12px; right:12px; z-index:25;
    padding:8px 16px; font-size:13px;
    background:#1a2030; border:1px solid #3a4a66; color:#cbd5e6;
    border-radius:6px;
}
#bagToggle{
    position:fixed; top:12px; right:80px; z-index:25;
    padding:8px 14px; font-size:12px;
    background:#1a2030; border:1px solid #3a4a66;
    color:#cbd5e6; border-radius:6px;
}
#bagPanel{
    position:fixed; top:54px; right:12px; z-index:24;
    width:280px; max-height:70vh;
    overflow-y:auto;
    background:#0d1220; border:1px solid #2a3550;
    border-radius:8px; padding:10px; display:none;
    color:#cbd5e6; font-size:13px;
}
#accessoryPanel{
    position:fixed; top:54px; right:12px; z-index:24;
    width:280px;
    max-height:70vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:#0d1220; border:1px solid #2a3550;
    border-radius:8px; padding:10px; display:none;
    color:#cbd5e6; font-size:13px;
    }
.ap-title{ color:#7fb8e8; margin-bottom:8px; letter-spacing:2px; }
.ap-item{
    padding:8px; border:1px solid #24304a; border-radius:6px;
    margin-bottom:6px; cursor:pointer; background:#111828;
}
.ap-item:hover{ background:#1a2438; }
.ap-item.equipped{ border-color:#6fa8e8; box-shadow:0 0 8px #2a4a7a; }
.ap-item .aname{ color:#e0e8f4; }
.ap-item .adesc{ color:#7a8aa0; font-size:11px; margin-top:3px; }
.ap-item .stat{ color:#ffd266; font-size:11px; margin-top:2px; }
.mini-btn{
    padding:5px 10px;
    font-size:11px;
    background:#243050;
    border:1px solid #3a4a66;
    color:#cfe0f0;
    border-radius:4px;
    cursor:pointer;
}
.mini-btn:hover{ background:#324464; }
.ap-feed{ background:#2a2040; border-color:#5a3a7a; color:#e0c0ff; }
.ch-take{ background:#204030; border-color:#3a6a4a; color:#c0f0d0; }

/* ===== 战斗界面 ===== */
#playerStatusBar{
    position:fixed; top:0; left:0; right:0;
    padding:8px 12px;
    background:rgba(8,10,18,0.92);
    border-bottom:1px solid #2a3550;
    z-index:110;
    display:none;
    flex-direction:column;
    gap:5px;
    font-family:system-ui;
}
.statusRow{
    display:flex; align-items:center;
    gap:8px; font-size:11px;
    color:#cbd5e6;
}
.statusLabel{
    width:28px;
    color:#7fb8e8;
    letter-spacing:1px;
    font-size:11px;
    text-align:center;
}
.statusLabel.energy-mode{
    color:#6ad8ff;
    text-shadow:0 0 6px #6ad8ff;
}
.barWrap{
    flex:1;
    height:11px;
    background:#0a0e16;
    border:1px solid #2a3550;
    border-radius:3px;
    overflow:hidden;
}
#playerHpBar{
    height:100%;
    background:#4ae8a0;
    width:100%;
    transition:width 0.25s, background 0.25s;
}
#playerMpBar{
    height:100%;
    background:linear-gradient(90deg,#4a8aff,#2a5ac8);
    width:100%;
    transition:width 0.25s, background 0.25s;
}
#playerMpBar.energy-mode{
    background:linear-gradient(90deg,#6ad8ff,#3a8ad8);
    box-shadow:0 0 8px #6ad8ff;
}
.statusNum{
    min-width:60px;
    text-align:right;
    font-family:monospace;
    font-size:11px;
    color:#cbd5e6;
}
#battleUI{
    display:none; position:fixed; inset:0;
    background:#08080c; z-index:100; color:#eee;
    padding:100px 16px 90px 16px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
}
    display:none;
    position:fixed;
    inset:0;
    background:#08080c;
    z-index:100;
    color:#eee;
    padding:24px;
    overflow:auto;
}
#playerDebuffBar{
    display:flex; flex-wrap:wrap;
    gap:4px;
    margin-bottom:2px;
    min-height:0;
}
.debuff-chip{
    padding:1px 6px;
    font-size:10px;
    background:rgba(40,60,90,0.85);
    border:1px solid #5a8ac8;
    color:#cfe4ff;
    border-radius:8px;
    letter-spacing:1px;
    font-family:system-ui;
}
.debuff-chip.stun{ background:rgba(120,80,20,0.85); border-color:#d8a040; color:#ffe8b0; }
.debuff-chip.poison{ background:rgba(60,100,40,0.85); border-color:#6ac850; color:#d0ffb0; }
.debuff-chip.suppress{ background:rgba(90,40,90,0.85); border-color:#c860c8; color:#ffd0ff; }
.debuff-chip.conduct{ background:rgba(30,60,110,0.85); border-color:#4a8ae8; color:#c0e0ff; }
.debuff-chip.thunder{ background:rgba(60,40,120,0.85); border-color:#8a6ae8; color:#d8c8ff; }
#enemyArea{
    text-align:center;
    margin-bottom:8px;
    position:relative;
    min-height:130px;
    height:auto;
}
#enemySprite{
    width:100px;
    height:110px;
    margin:0 auto 4px;
    background:#221414;
    border:2px solid #442222;
    position:relative;
}
#enemyList{
    display:flex; flex-direction:column;
    gap:4px;
    margin:6px auto 8px;
    max-width:280px;
}
.enemy-list-item{
    display:flex; justify-content:space-between;
    align-items:center;
    padding:6px 10px;
    background:rgba(30,20,20,0.9);
    border:1px solid #442222;
    border-radius:4px;
    font-size:12px;
    color:#cbd5e6;
    cursor:pointer;
}
.enemy-list-item.selected{
    border-color:#ffd266;
    box-shadow:0 0 8px #ffd266;
    background:rgba(50,35,15,0.9);
}
.enemy-list-item .elname{
    color:#e0e8f4;
}
.enemy-list-item .elhp{
    font-family:monospace;
    color:#e89090;
    font-size:11px;
}
#debuffTag{
    margin-top:6px;
    color:#77ccff;
    min-height:18px;
    font-size:13px;
}
.slash-effect{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    pointer-events:none;
}
.white-slash{
    position:absolute;
    background:#ffffff;
    box-shadow: 0 0 12px #fff;
    transform-origin: center;
    opacity:0;
}
.enemyHpWrap{
    width:260px;
    margin:0 auto;
    border:1px solid #666;
    height:18px;
    background:#111;
}
#enemyHpBar{
    height:100%;
    background:#c83838;
    transition:width 0.25s;
}
#msgBox{
    border:1px solid #555;
    min-height:70px;
    max-height:110px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:10px; margin:8px 0;
    background:#0f0f16; white-space:pre-line;
    font-size:13px; line-height:1.5;
}
    border:1px solid #555;
    min-height:110px;
    max-height:160px;
    overflow-y:auto;
    padding:12px;
    margin:16px 0;
    background:#0f0f16;
    white-space:pre-line;
    font-size:14px;
    line-height:1.6;
}
#mokuDialog{
    border: 1px solid #324060;
    min-height: 72px;
    padding: 10px 14px;
    margin-bottom:12px;
    background:#0c0e18;
    display:none;
}
#mokuDialog .tag{
    color:#73a8e8;
    font-weight:bold;
    margin-bottom:4px;
}
#mokuText{ color:#cbd5e6; }

#actionBar, #spellBar, #itemBar{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:10px;
    margin-top:12px;
}
#skillBar{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:10px;
    margin-top:12px;
}
#skillBar, #spellBar, #itemBar{ display:none; }

button{
    padding:12px;
    border:none;
    background:#202430;
    color:#fff;
    font-size:15px;
    border-radius:6px;
    cursor:pointer;
}
button:hover{ background:#2c3244; }
button:disabled{ background:#12141a; color:#666; cursor:default; }

/* ===== 霆落雷鸣特效 ===== */
#scytheGame{
    position:fixed; inset:0;
    z-index:170;
    background:rgba(2,4,10,0.95);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    pointer-events:auto;
}
#scytheCanvas{
    border:2px solid #6ad8ff;
    box-shadow:0 0 24px #2a5a8a, inset 0 0 40px rgba(30,60,120,0.4);
    background:#080c16;
    touch-action:none;
    border-radius:6px;
}
#scytheHud{
    color:#cfe4ff; font-size:14px;
    display:flex; gap:20px;
    letter-spacing:1px;
    font-family:system-ui;
}
#scytheLineCount{ color:#ffd266; font-size:17px; }
#scytheHint{ color:#7fb8e8; font-size:12px; }

#spaceBreakText{
    position:fixed;
    top:40%; left:0; right:0;
    text-align:center;
    font-size:44px;
    font-weight:bold;
    color:#6ad8ff;
    text-shadow:0 0 20px #6ad8ff, 0 0 40px #3a6bd8, 0 0 60px #3a6bd8;
    letter-spacing:12px;
    z-index:180;
    pointer-events:none;
    display:none;
    font-family:system-ui;
}
.spaceBreakAnim{
    animation:spaceBreakFlash 1s ease-out forwards;
}
@ spaceBreakFlash{
    0%{ opacity:0; transform:scale(0.5); letter-spacing:30px; }
    20%{ opacity:1; transform:scale(1.1); letter-spacing:12px; }
    60%{ opacity:1; transform:scale(1); }
    100%{ opacity:0; transform:scale(1.2); }
}
.screenFlashBlack{
    background:#000000;
    animation:flashFade 0.15s ease-out forwards;
}
#screenFlash{
    position:fixed; inset:0;
    pointer-events:none;
    z-index:169;
    display:none;
}
.screenFlashWhite{
    background:#ffffff;
    animation:flashFade 0.15s ease-out forwards;
}
.screenFlashBlue{
    background:radial-gradient(circle at 50% 50%, rgba(200,240,255,0.9), rgba(106,216,255,0.4));
    animation:flashFade 0.2s ease-out forwards;
}
@ flashFade{
    0%{ opacity:0.9; }
    100%{ opacity:0; }
}

#comboFx{
    position:fixed; inset:0; pointer-events:none;
    z-index:140; display:none; overflow:hidden;
}
.comboLine{
    position:absolute;
    height:3px;
    background:linear-gradient(90deg, transparent, #6ad8ff, #ffffff);
    box-shadow:0 0 12px #6ad8ff, 0 0 24px #3a6bd8;
    transform-origin:left center;
    animation:comboLineAnim 0.4s ease-out forwards;
}
@ comboLineAnim{
    0%{ opacity:0; transform:scaleX(0); }
    30%{ opacity:1; transform:scaleX(1); }
    70%{ opacity:1; }
    100%{ opacity:0; }
}
.comboHit{
    position:absolute;
    width:80px; height:80px;
    margin-left:-40px; margin-top:-40px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.9), rgba(106,216,255,0.4), transparent 70%);
    animation:comboHitAnim 0.5s ease-out forwards;
}
@ comboHitAnim{
    0%{ opacity:0; transform:scale(0.3); }
    30%{ opacity:1; transform:scale(1.2); }
    100%{ opacity:0; transform:scale(1.8); }
}
.comboFlash{
    position:absolute; inset:0;
    background:radial-gradient(circle at 50% 40%, rgba(200,240,255,0.5), transparent 60%);
    animation:comboFlashAnim 0.35s ease-out forwards;
}
@keyframes comboFlashAnim{
    0%{ opacity:0; }
    30%{ opacity:1; }
    100%{ opacity:0; }
}
#thunderFx{
    position:fixed; inset:0; pointer-events:none; z-index:150;
    display:none; overflow:hidden;
}
.bolt{
    position:absolute; top:0; width:4px;
    background:linear-gradient(180deg,#fff,#9fe8ff,#3a6bd8);
    box-shadow:0 0 18px #9fe8ff, 0 0 40px #3a6bd8;
    transform-origin:top center;
    animation:boltFlash 0.55s ease-out forwards;
}
@keyframes boltFlash{
    0%{ opacity:0; transform:scaleY(0); }
    15%{ opacity:1; transform:scaleY(1); }
    60%{ opacity:1; }
    100%{ opacity:0; }
}
.thunderVeil{
    position:absolute; inset:0;
    background:radial-gradient(circle at 50% 20%, rgba(180,230,255,0.35), transparent 60%);
    animation:veilFade 0.75s ease-out forwards;
}
@keyframes veilFade{ 0%{opacity:0} 30%{opacity:1} 100%{opacity:0} }
/* ===== 致幻特效 ===== */
#hallucinationFx{
    position:fixed; inset:0;
    pointer-events:none;
    z-index:168;
    display:none;
    overflow:hidden;
}
.hallucinationFog{
    position:absolute;
    width:80vw; height:80vw;
    border-radius:50%;
    background:radial-gradient(circle, rgba(160,80,220,0.45), rgba(100,40,180,0.15) 50%, transparent 75%);
    filter:blur(40px);
    top:10%; left:-20%;
    animation:hallucinationDrift 8s ease-in-out infinite;
}
.hallucinationFog.f2{
    width:100vw; height:100vw;
    top:-20%; left:30%;
    background:radial-gradient(circle, rgba(120,60,200,0.4), rgba(80,30,150,0.1) 50%, transparent 75%);
    animation-duration:11s;
    animation-delay:-3s;
}
.hallucinationFog.f3{
    width:70vw; height:70vw;
    top:40%; left:20%;
    background:radial-gradient(circle, rgba(180,100,240,0.35), transparent 70%);
    animation-duration:9s;
    animation-delay:-6s;
}
@keyframes hallucinationDrift{
    0%{ transform:translate(0,0) scale(1); opacity:0.6; }
    25%{ transform:translate(20vw,10vh) scale(1.15); opacity:0.9; }
    50%{ transform:translate(-10vw,20vh) scale(0.9); opacity:0.7; }
    75%{ transform:translate(15vw,-10vh) scale(1.2); opacity:0.95; }
    100%{ transform:translate(0,0) scale(1); opacity:0.6; }
}
#hallucinationFx::after{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(80,20,120,0.55) 100%);
    animation:hallucinationPulse 3s ease-in-out infinite;
}
@keyframes hallucinationPulse{
    0%,100%{ opacity:0.5; }
    50%{ opacity:0.95; }
}
/* ===== 战斗胜利弹窗 ===== */
#victoryScreen{
    position:fixed; inset:0;
    z-index:200;
    background:rgba(4,6,14,0.88);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    pointer-events:none;
}
.victoryTitle{
    font-size:42px;
    font-weight:bold;
    color:#6ad8ff;
    letter-spacing:14px;
    text-shadow:0 0 20px #6ad8ff, 0 0 40px #3a6bd8;
    font-family:system-ui;
}
#victoryContent{
    display:flex; flex-direction:column;
    gap:10px; align-items:center;
}
.victoryRow{
    font-size:16px;
    color:#cbd5e6;
    font-family:system-ui;
    letter-spacing:2px;
}
.victoryNum{
    color:#4ae8a0;
    font-weight:bold;
    margin-left:8px;
}
.victoryLoot{
    color:#ffd266;
    font-weight:bold;
    margin-left:8px;
}
.victoryEmpty{
    color:#5a6478;
}
.victoryAnim{
    animation:victoryFadeIn 0.4s ease-out;
}
@keyframes victoryFadeIn{
    0%{ opacity:0; transform:scale(0.85); }
    100%{ opacity:1; transform:scale(1); }
}
</style>
</head>

const TILE = 48;
const MAP_COLS = 40;
const MAP_ROWS = 28;
const map = [];
for(let r = 0; r < MAP_ROWS; r++){
    map[r] = [];
    for(let c = 0; c < MAP_COLS; c++){
        if(r === 0 || r === MAP_ROWS - 1 || c === 0 || c === MAP_COLS - 1){
            map[r][c] = 1;
        }else{
            map[r][c] = 0;
        }
    }
}

for(let r = 3; r <= 12; r++) map[r][12] = 1;
for(let r = 15; r <= 24; r++) map[r][26] = 1;
map[14][10] = 1;
map[10][30] = 1;

const worldW = MAP_COLS * TILE;
const worldH = MAP_ROWS * TILE;

function isWall(worldX, worldY){
    const col = Math.floor(worldX / TILE);
    const row = Math.floor(worldY / TILE);
    if(col < 0 || col >= MAP_COLS || row < 0 || row >= MAP_ROWS) return true;
    return map[row][col] === 1;
}

/* =========================================================

========================================================= */
const joy = document.getElementById("joystick");
const stick = document.getElementById("stick");
let joyActive = false;
let joyDx = 0, joyDy = 0;
const joyR = 55;

function setStickPos(dx, dy){
    stick.style.left = (70 + dx * joyR - 30) + "px";
    stick.style.top  = (70 + dy * joyR - 30) + "px";
}

joy.addEventListener("pointerdown", (e)=>{
    if(!gameStarted || battleActive) return;
    joyActive = true;
    joy.setPointerCapture(e.pointerId);
    handleJoyMove(e);
});
window.addEventListener("pointermove", (e)=>{
    if(!gameStarted || !joyActive) return;
    handleJoyMove(e);
});
function handleJoyMove(e){
    const r = joy.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const dx = e.clientX - cx;
    const dy = e.clientY - cy;
    const len = Math.hypot(dx, dy);
    if(len > joyR){
        joyDx = dx / len;
        joyDy = dy / len;
    }else{
        joyDx = dx / joyR;
        joyDy = dy / joyR;
    }
    setStickPos(joyDx, joyDy);
}
function resetJoy(){
    joyActive = false;
    joyDx = 0; joyDy = 0;
    stick.style.left = "40px";
    stick.style.top  = "40px";
}
window.addEventListener("pointerup", resetJoy);
window.addEventListener("pointercancel", resetJoy);

const keys = {};
window.addEventListener("keydown", e=> keys[e.code]=true);
window.addEventListener("keyup", e=> keys[e.code]=false);

function getMoveDir(){
    let mx = 0, my = 0;
    if(keys["KeyW"] || keys["ArrowUp"]) my -= 1;
    if(keys["KeyS"] || keys["ArrowDown"]) my += 1;
    if(keys["KeyA"] || keys["ArrowLeft"]) mx -= 1;
    if(keys["KeyD"] || keys["ArrowRight"]) mx += 1;
    if(joyActive){ mx += joyDx; my += joyDy; }
    const l = Math.hypot(mx, my);
    if(l > 0) return { x: mx/l, y: my/l };
    return { x:0, y:0 };
}

    osc.type = "triangle";
    osc.frequency.setValueAtTime(90, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.07);
    gain.gain.setValueAtTime(0.10, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.07);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.07);
}

    ctx.fillStyle = "#eeeeee";
    ctx.fillRect(-5*s, -9*s, 10*s, 8*s);

    ctx.fillRect(-4*s, -7*s, 2*s, 2*s);
    ctx.fillStyle = "#9888dd";
    ctx.fillRect(2*s, -7*s, 2*s, 2*s);
    ctx.fillStyle = "#222228";
    ctx.fillRect(-6*s, -1*s, 12*s, 7*s);
    ctx.fillStyle = "#333a48";
    ctx.fillRect(-5*s, 6*s, 10*s, 5*s);

    ctx.restore();
}
function drawMokuBubble(sx, sy){
    ctx.save();
    ctx.font = "13px system-ui";
    ctx.textAlign = "center";
    var text = mokuBubble.text;
    var textW = ctx.measureText(text).width;
    var pad = 10;
    var bw = textW + pad * 2;
    var bh = 26;
    var bx = sx - bw / 2;
    var by = sy - 60;

    var alpha = Math.min(1, mokuBubble.timer / 0.4);
    ctx.globalAlpha = alpha;

    ctx.fillStyle = "rgba(20, 30, 50, 0.92)";
    ctx.strokeStyle = "#6ad8ff";
    ctx.lineWidth = 1.5;

    var r = 8;
    ctx.beginPath();
    ctx.moveTo(bx + r, by);
    ctx.lineTo(bx + bw - r, by);
    ctx.quadraticCurveTo(bx + bw, by, bx + bw, by + r);
    ctx.lineTo(bx + bw, by + bh - r);
    ctx.quadraticCurveTo(bx + bw, by + bh, bx + bw - r, by + bh);
    ctx.lineTo(bx + r, by + bh);
    ctx.quadraticCurveTo(bx, by + bh, bx, by + bh - r);
    ctx.lineTo(bx, by + r);
    ctx.quadraticCurveTo(bx, by, bx + r, by);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(sx - 6, by + bh);
    ctx.lineTo(sx, by + bh + 8);
    ctx.lineTo(sx + 6, by + bh);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#cfe4ff";
    ctx.fillText(text, sx, by + 18);
    ctx.restore();
}
function drawMoku(sx, sy, flip){
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(flip, 1);
    const s = 3;
    ctx.fillStyle = "#f4f6fa";
    ctx.fillRect(-7*s, -11*s, 14*s, 12*s);
    ctx.fillStyle = "#54a7cc";
    ctx.fillRect(3*s, -4*s, 4*s, 5*s);
    ctx.fillStyle = "#eeeeee";
    ctx.fillRect(-5*s, -8*s, 10*s, 7*s);
    ctx.fillStyle = "#7b58a0";
    ctx.fillRect(-4*s, -6*s, 2*s, 2*s);
    ctx.fillRect(2*s, -6*s, 2*s, 2*s);
    ctx.fillStyle = "#19191f";
    ctx.fillRect(-6*s, -1*s, 12*s, 9*s);
    ctx.fillStyle = "#303846";
    ctx.fillRect(-5*s, 8*s, 10*s, 4*s);
    ctx.fillStyle = "#111114";
    ctx.fillRect(-4*s, 12*s, 3*s, 6*s);
    ctx.fillRect(1*s, 12*s, 3*s, 6*s);
    ctx.restore();
}
function drawChest(ch){
    if(ch.opened) return;
    const sx = ch.x - cam.x;
    const sy = ch.y - cam.y;
    ctx.fillStyle = "#8b6b38";
    ctx.fillRect(sx - 16, sy - 12, 32, 22);
    ctx.fillStyle = "#c9a24f";
    ctx.fillRect(sx - 16, sy - 12, 32, 5);
    ctx.fillStyle = "#5a4520";
    ctx.fillRect(sx - 3, sy - 4, 6, 14);
}
function drawEventPoint(ev){
    if(ev.triggered) return;
    const sx = ev.x - cam.x;
    const sy = ev.y - cam.y;
    const t = performance.now() / 400;
    const pulse = 1 + Math.sin(t) * 0.2;
    ctx.save();
    ctx.globalAlpha= 0.85;
    ctx.fillStyle = "#6ad8ff";
    ctx.beginPath();
    ctx.arc(sx, sy, 12 * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#eaffff";
    ctx.beginPath();
    ctx.arc(sx, sy, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}
function drawMapEnemy(e){
    const sx = e.x - cam.x;
    const sy = e.y - cam.y;
    ctx.save();
    ctx.translate(sx, sy);
    const s = 3;
    ctx.fillStyle = e.color || "#3b1818";
    ctx.fillRect(-6*s, -10*s, 12*s, 18*s);
    ctx.fillStyle = "#ff4444";
    ctx.fillRect(-3*s, -7*s, 2*s, 2*s);
    ctx.fillRect(1*s, -7*s, 2*s, 2*s);
    ctx.restore();
}

const player = {
    x: TILE * 3,
    y: TILE * 3,
    spd: 270,
    facing: 1,
    hp: 300,
    maxHp: 300,
    invincible: 0,
    moving: false,
    statuses: {},
    update(dt){
        const d = getMoveDir();
        this.moving = (d.x !== 0 || d.y !== 0);
        if(this.moving){
            const nx = this.x + d.x * this.spd * dt;
            const ny = this.y + d.y * this.spd * dt;
            if(!isWall(nx, this.y)) this.x = nx;
            if(!isWall(this.x, ny)) this.y = ny;
            if(d.x !== 0) this.facing = d.x > 0 ? 1 : -1;
            walkSoundTimer += dt;
            if(walkSoundTimer > 0.32){ walkSoundTimer = 0; playWalkSound(); }
        }
        if(this.invincible > 0) this.invincible -= dt;
    },
    draw(){
        drawSuixing(this.x - cam.x, this.y - cam.y, this.facing, this.invincible > 0);
    }
}

const moku = {
    x: TILE * 4,
    y: TILE * 3,
    spd: 220,
    followDist: 65,
    facing: 1,
    update(dt){
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const dist = Math.hypot(dx, dy);
        if(dist > this.followDist){
            const nx = this.x + (dx/dist) * this.spd * dt;
            const ny = this.y + (dy/dist) * this.spd * dt;
            if(!isWall(nx, this.y)) this.x = nx;
            if(!isWall(this.x, ny)) this.y = ny;
            if(dx !== 0) this.facing = dx > 0 ? 1 : -1;
        }
    },
    draw(){ drawMoku(this.x - cam.x, this.y - cam.y, this.facing); }
}

let mapEnemies = [];
function spawnPatrolEnemy(){
    for(let attempt = 0; attempt < 80; attempt++){
        const c = 2 + Math.floor(Math.random() * (MAP_COLS - 4));
        const r = 2 + Math.floor(Math.random() * (MAP_ROWS - 4));
        const ex = c * TILE + TILE/2;
        const ey = r * TILE + TILE/2;
        if(isWall(ex, ey)) continue;
        if(Math.hypot(ex - player.x, ey - player.y) < TILE * 4) continue;

        // 【新增】40% 概率生成一群敌人（2-3个）
        var groupCount = Math.random() < 0.4 ? (Math.random() < 0.5 ? 2 : 3) : 1;
        var group = [];
        for (var g = 0; g < groupCount; g++) {
            var offsetX = (Math.random() - 0.5) * TILE * 3.5;
            var offsetY = (Math.random() - 0.5) * TILE * 3.5;
            var finalEx = ex + offsetX;
            var finalEy = ey + offsetY;
            
            if (isWall(finalEx, finalEy)) continue;
            if (Math.hypot(finalEx - player.x, finalEy - player.y) < TILE * 4) continue;

            const tpl = ENEMY_TYPES[Math.floor(Math.random() * ENEMY_TYPES.length)];
            group.push({
                x: finalEx, y: finalEy,
                faction: tpl.faction,
                hp: tpl.hp, maxHp: tpl.hp,
                name: tpl.name, color: tpl.color, moves: tpl.moves,
                patrol: {
                    dx: Math.random() > 0.5 ? 1 : -1,
                    dy: Math.random() > 0.5 ? 1 : -1,
                    spd: 60,
                    timer: 0
                }
            });
        }
        if (group.length > 0) {
            mapEnemies.push(...group);
            return true;
        }
    }
    return false;
}
for(let i = 0; i < 10; i++) spawnPatrolEnemy();

function updateMapEnemies(dt){
    for(const e of mapEnemies){
        e.patrol.timer -= dt;
        if(e.patrol.timer <= 0){
            e.patrol.timer = 1 + Math.random() * 1.5;
            e.patrol.dx = (Math.random() > 0.5 ? 1 : -1);
            e.patrol.dy = (Math.random() > 0.5 ? 1 : -1);
        }
        const nx = e.x + e.patrol.dx * e.patrol.spd * dt;
        const ny = e.y + e.patrol.dy * e.patrol.spd * dt;
        if(!isWall(nx, e.y)) e.x = nx; else e.patrol.dx *= -1;
        if(!isWall(e.x, ny)) e.y = ny; else e.patrol.dy *= -1;
    }
}

        const cx = c * TILE + TILE/2;
        const cy = r * TILE + TILE/2;

        let ok = true;
        for(const ch of chestList){

        if(ok){ chestList.push({ x: cx, y: cy, opened: false }); return true; }
    }
    return false;
}

        var group = [e];

            if(other === e) continue;

            }
        }

}
    // 宝箱
    for(const ch of chestList){

            openChest(ch);

    for(const ev of eventList){

function triggerEvent(ev){
    ev.triggered = true;
    const roll = Math.random();
    if(roll < 0.4){
        var before = player.hp;
        player.hp = Math.min(player.maxHp, player.hp * 1.5);
        var gain = Math.floor(player.hp - before);
        showPickupToast("异常治愈波：恢复 " + gain + " HP");

        inventory.push(acc);

/* ---------- 暴击 & 伤害计算 ---------- */

function getCritRate(){
    if(hasAccFlag("critOverride")) return 1.5;
    return 0.20 + getAccSum("critBonus");
}

function rollDamage(baseDmg){
    var rate = getCritRate();
    var critChance = Math.min(rate, 1);
    var overflow = Math.max(0, rate - 1);
    var isCrit = Math.random() < critChance;
    var dmg = baseDmg;
    if(isCrit) dmg *= (1.5 + overflow);
    dmg *= (1 + getAccSum("dmgBonus"));
dmg *= player.dmgMul;
if(isCrit) warDanceHeal();
    return { dmg: Math.max(1, Math.floor(dmg)), isCrit: isCrit };
}

function calcPlayerDamage(base, isSpell, isThunder){
    let dmg = base;
    // 保留原有的压制减伤逻辑
    if(isSpell && player.statuses[STATUS.SUPPRESS]){
        dmg *= (1 - player.statuses[STATUS.SUPPRESS].value);
    }
    // 【雷羽】雷属性伤害增加10%
    if(isThunder && hasAccSpecial("thunderFeather")){
        dmg *= 1.1;
    }
    return rollDamage(dmg);
}
function calcEnemyDefenseMul(){
    var bonus = getAccSum("defBonus");
    if(typeof mokuForm !== "undefined" && mokuForm === "core") bonus += 0.10;
    return Math.max(0.2, 1 - bonus);
}

/* ---------- 状态处理 ---------- */
function applyStatus(target, type, turns, value = 0){
    if(target === player && type === STATUS.STUN
       && hasAccFlag("immuneStun")){
        msgBox.innerText += "\n【无根之雨滴】抵消了眩晕。";
        return false;
    }
    target.statuses[type] = { turns, value };
    return true;
}
function tickStatuses(target){
    let skipTurn = false;
    for(const type in target.statuses){
    // 【雷羽】静电状态跳过结算，不被消耗
if(type === "static") continue;
        const st = target.statuses[type];
        
        // 1. 中毒
        if(type === STATUS.POISON){
            target.hp = Math.max(0, target.hp - st.value);
            msgBox.innerText += `\n中毒：损失 ${st.value} HP。`;
        }
        
        // 2. 导电
        if(type === STATUS.CONDUCT){
            if(target === player && hasAccSpecial("thunderSpell")){
                // 麒麟的角：免疫导电伤害
            }else{
                target.hp = Math.max(0, target.hp - st.value);
                msgBox.innerText += `\n导电灼伤：电流灼烧 ${st.value} HP。`;
            }
        }
        
        // 3. 雷霆（电虫特性正确放置的位置）
        if(type === STATUS.THUNDER){
            var thunderDmg = st.value;
            // 【电虫特性】雷属性抗性
            if(target.faction && target.faction.indexOf("何类生物（电虫）") !== -1){
                thunderDmg = Math.floor(thunderDmg * 0.5);
                msgBox.innerText += `\n【电虫抗性】雷霆效果减半。`;
            }
            target.hp = Math.max(0, target.hp - thunderDmg);
            msgBox.innerText += `\n雷霆：损失 ${thunderDmg} HP。`;
        }
        
        // 4. 腐蚀
        if(type === STATUS.CORRODE){
            target.hp = Math.max(0, target.hp - 5);
            msgBox.innerText += `\n腐蚀：损失 5 HP。`;
        }
        
        // 5. 眩晕
        if(type === STATUS.STUN && st.turns > 0) {
            skipTurn = true;
            msgBox.innerText += `\n【眩晕】${target.name || "你"} 头晕目眩，无法行动！`;
        }
        
        st.turns--;
        if(st.turns <= 0) delete target.statuses[type];
    }
    return skipTurn;
}

/* ---------- 玩家动作 ---------- */
var actionLock = false; 

function battleAction(action){
    if(actionLock) return; 
    if(!battleActive || !currentEnemy) return;

    if(action === "skill"){ openSubMenu("skill"); return; }
    if(action === "spell"){ openSubMenu("spell"); return; }
    if(action === "item"){ openSubMenu("item"); return; }

    if(action === "escape"){
        if(Math.random() < 0.45){
            msgBox.innerText += "\n逃跑成功。";
            setTimeout(endBattle, 500);
        }else{
            msgBox.innerText += "\n逃跑失败！";
            setTimeout(enemyTurn, 500);
        }
        return;
    }

    actionLock = true;
    setTimeout(function(){ actionLock = false; }, 500); 
    enableActionButtons(false);

    // 【2.5秒看门狗】只要还在战斗中，2.5秒后无条件恢复按键
    setTimeout(function(){
        if (battleActive) enableActionButtons(true);
    }, 2500);

    try {
        if(action === "spaceCut" || action === "rift" || action === "thunderFall"){
            var cost = MP_COST[action] || 0;
            if(player.mp < cost){
                msgBox.innerText += "\nMP 不足（需要 " + cost + "）。";
                scrollMsgToBottom();
                enableActionButtons(true);
                actionLock = false;
                return;
            }
        }
        if(liberationReady && action !== "escape" && action !== "energyGather"){
            var cost = (action === "liberation") ? 50 : 10;
            liberationEnergy = Math.max(0, liberationEnergy - cost);
            if(liberationEnergy <= 0) exitLiberation();
        }
        
        switch(action){
            case "attack": doAttack(); break;
            case "parry":  doParry(); break;
            case "axeSlash": doAxeSlash(); break;
            case "spaceCut": player.mp = Math.max(0, player.mp - MP_COST.spaceCut); doSpaceCut(); break;
            case "rift": player.mp = Math.max(0, player.mp - MP_COST.rift); doRift(); break;
            case "thunderFall": player.mp = Math.max(0, player.mp - MP_COST.thunderFall); doThunderFall(); break;
            case "shard": doShard(); break;
            case "chamber": doChamber(); break;
            case "energyGather": doEnergyGather(); break;
            case "liberation": doLiberation(); break;
        }
    } catch(e) {
        console.error("玩家行动崩溃，已强制跳过:", e);
        enableActionButtons(true); 
        actionLock = false;
    }
} // ← 结束括号，只能有一个！

/* ---------- 屏幕震动 ---------- */
function screenShake(intensity = 6, duration = 300){
    const start = performance.now();
    function shake(){
        const t = performance.now() - start;
        if(t > duration){ canvas.style.transform = ""; return; }
        const k = (1 - t/duration) * intensity;
        canvas.style.transform = `translate(${(Math.random()-0.5)*k}px,${(Math.random()-0.5)*k}px)`;
        requestAnimationFrame(shake);
    }
    shake();
}

/* ---------- 玩家行动后判定 ---------- */
function isAllEnemiesDead(){
    for(var i = 0; i < currentEnemies.length; i++){
        if(currentEnemies[i].hp > 0) return false;
    }
    return true;

function afterPlayerAction(){
    if(isAllEnemiesDead()){
        endBattle(true);

/* ---------- 敌人回合 ---------- */
function enemyTurn(){
    if(!battleActive) return;
    
    // 1. 结算所有敌人状态
    for(var i = 0; i < currentEnemies.length; i++){
        if(currentEnemies[i].hp > 0){
            if(tickStatuses(currentEnemies[i])){
                msgBox.innerText += "\n" + currentEnemies[i].name + " 因眩晕无法行动。";
                currentEnemies[i].stunnedThisTurn = true;
            } else {
                currentEnemies[i].stunnedThisTurn = false;
            }
        }
    }
    
    updateDebuffTag();
    updateEnemyHpBar();
    scrollMsgToBottom();
    if(isAllEnemiesDead()){ endBattle(true); return; }
    
    // 2. 收集活着的且没被眩晕的敌人
    var queue = [];
    for(var i = 0; i < currentEnemies.length; i++){
        if(currentEnemies[i].hp > 0 && !currentEnemies[i].stunnedThisTurn){
            queue.push(i);
        }
    }
    
    // 3. 依次行动
    runEnemyQueue(queue, 0);
}

function runEnemyQueue(queue, index){
    if(!battleActive) return;
    if(index >= queue.length){
        setTimeout(function(){
            try {
                tickStatuses(player);
                updateBattleUI();
            } catch(e) {
                console.log("状态刷新出错，但战斗继续", e);
            }
            if(player.hp <= 0){ endBattle(false); return; }
            endEnemyTurn();
        }, 400);
        return;
    }
    
    var ei = queue[index];
    selectedEnemyIndex = ei;
    var enemy = currentEnemies[ei];
    
    updateEnemyHpBar();
    updateDebuffTag();
    scrollMsgToBottom();
    
    doEnemySingleAction(enemy, function(){
        if(!battleActive) return;
        if(player.hp <= 0){ endBattle(false); return; }
        if(enemy.hp <= 0){ updateEnemyHpBar(); }
        setTimeout(function(){
            runEnemyQueue(queue, index + 1);
        }, 600);
    });
}

function applyShieldDamage(dmg){
    if(player.shield > 0){
        var absorbed = Math.min(player.shield, dmg);
        player.shield -= absorbed;
        dmg -= absorbed;
        if(absorbed > 0){
            msgBox.innerText += ` 【护盾吸收 ${absorbed}】`;
        }
    }
    return dmg;
}

function doEnemySingleAction(enemy, callback){
    try {
        // 1. 选取敌人招式
        var moves = (enemy.moves && enemy.moves.length) ? enemy.moves : [{ name: "撞击", type: "phys", dmg: 10, hits: 1 }];
        var mv = moves[Math.floor(Math.random() * moves.length)];

        // 2. 奔狼召唤
        if(enemy.name.indexOf("奔狼") >= 0 
           && !enemy.howled
           && enemy.hp / enemy.maxHp < 0.2 
           && Math.random() < 0.4){
            enemy.howled = true;
            msgBox.innerText += "\n【狼群呼唤】远处传来回应的嚎叫……";
            var summonCount = Math.random() < 0.5 ? 1 : 2;
            for(var s = 0; s < summonCount; s++){
                var wolfTpl = null;
                for(var ti = 0; ti < ENEMY_TYPES.length; ti++){
                    if(ENEMY_TYPES[ti].name === "奔狼"){ wolfTpl = ENEMY_TYPES[ti]; break; }
                }
                if(!wolfTpl) break;
                currentEnemies.push({
                    name: wolfTpl.name,
                    faction: "野生",
                    hp: wolfTpl.hp,
                    maxHp: wolfTpl.hp,
                    color: wolfTpl.color,
                    moves: wolfTpl.moves.map(function(m){ return Object.assign({}, m); }),
                    statuses: {}
                });
            }
            msgBox.innerText += " 援军赶到（" + summonCount + " 只奔狼加入战斗）。";
            playHeavyHit();
            updateEnemyHpBar();
            renderEnemyList();
            scrollMsgToBottom();
            setTimeout(callback, 800);
            return;
        }
        
        // 3. 伤害计算
        var hits = mv.hits || 1;
        var atkMul = 1;
        if(enemy.statuses[STATUS.SUPPRESS]){
            atkMul -= enemy.statuses[STATUS.SUPPRESS].value;
            if (enemy.faction && enemy.faction.indexOf("何类生物（电虫）") !== -1) {
    atkMul *= 1.3; 
}
        }
        var total = 0;
        for(var i = 0; i < hits; i++){
            var dmg = mv.dmg * atkMul;
            if(enemy.statuses[STATUS.CONDUCT] && mv.type === "elec") dmg *= 1.5;
            total += dmg;
        }

        // 4. 混战逻辑判定目标
        var isMelee = false;
        var targetObj = null;
        
        if (enemy.faction) {
            var hostileTargets = currentEnemies.filter(function(e){
                return e.hp > 0 && e.faction && e.faction !== enemy.faction; 
            });
            // 60% 概率攻击敌对阵营
            if (hostileTargets.length > 0 && Math.random() < 0.6) {
                targetObj = hostileTargets[Math.floor(Math.random() * hostileTargets.length)];
                isMelee = true;
            }
        }

        // 5. 弹反 (仅在玩家被攻击时生效)
        if (!isMelee && parryActive && mv.noParry){
            parryActive = false;
            msgBox.innerText += `\n【${mv.name}】无法弹反！`;
            playHeavyHit();
        } else if (!isMelee && parryActive){
            parryActive = false;
            var reflect = Math.floor(total * 0.6);
            var selfDmg = Math.floor(total * 0.4);
            enemy.hp = Math.max(0, enemy.hp - reflect);
            selfDmg = Math.floor(selfDmg * calcEnemyDefenseMul());
            selfDmg = applyShieldDamage(selfDmg);
            player.hp = Math.max(0, player.hp - selfDmg);
            msgBox.innerText += `\n你弹反了【${mv.name}】，反弹 ${reflect} 伤害，自身受到 ${selfDmg} 伤害。`;
            playHeavyHit();
            updateEnemyHpBar();
            updateBattleUI();
            scrollMsgToBottom();
            setTimeout(callback, 400);
            return;
        }
        
        // 6. 攻击结算
        total = Math.floor(total * calcEnemyDefenseMul());
        
        if (isMelee) {
            // 【混战发生】：攻击其他阵营的敌人
            var dmgTaken = total;
            var logExtra = "";
            if (targetObj.defending) {
                dmgTaken = Math.floor(dmgTaken * 0.5);
                logExtra = "（目标处于防御姿态，伤害减半）";
                targetObj.defending = false; 
            }
            
            targetObj.hp = Math.max(0, targetObj.hp - dmgTaken);
            msgBox.innerText += `\n【混战】${enemy.name} 对 ${targetObj.name} 使用【${mv.name}】，造成 ${dmgTaken} 伤害。${logExtra}`;
            playHitSound();
            updateEnemyHpBar();
            updateDebuffTag();
            
            if(mv.status && Math.random() < (mv.chance || 1)){
                applyStatus(targetObj, mv.status, mv.turns, mv.value);
                msgBox.innerText += ` ${targetObj.name} 被施加了【${STATUS_LABEL[mv.status]}】。`;
            }
            
            if (isAllEnemiesDead()) {
                setTimeout(function(){ endBattle(true); }, 500);
                return;
            }
        } else {
            // 【正常攻击】：攻击玩家
            total = applyShieldDamage(total);
            player.hp = Math.max(0, player.hp - total);
            
            msgBox.innerText += `\n${enemy.name} 对 你 使用【${mv.name}】，造成 ${total} 伤害。`;
            if (total === 0 && player.shield > 0) msgBox.innerText += "（护盾完全吸收）";
            
            playHitSound();
            showMokuDialog("hurtPlayer");
            updateBattleUI();
            
            if(player.hp <= 0){ setTimeout(callback, 400); return; }
            
            // 附加状态给玩家
            if(mv.status && Math.random() < (mv.chance || 1)){
                var applied = applyStatus(player, mv.status, mv.turns, mv.value);
                if(applied){
                    msgBox.innerText += ` 你被施加了【${STATUS_LABEL[mv.status]}】。`;
                    showMokuDialog("status");
                }
                if(mv.name === "消化液雾释放"){
                    player.hallucinate = true;
                    player.hallucinateTurns = 3;
                    msgBox.innerText += ` 你陷入了【致幻】。`;
                }
            }
        }
        setTimeout(callback, 500);
    } catch(e) {
        console.error("敌人行动崩溃，已强制跳过:", e);
        setTimeout(callback, 500); 
    }
}

function rollLoot(){
    var roll = Math.random();
    if(roll < 0.35){
        return accessoryList[Math.floor(Math.random() * accessoryList.length)];
    }else if(roll < 0.75){
        return { name: "终焉之匣碎片", isItem: true };
    }else{
        return null;
    }
}

function showVictoryScreen(exp, lootName){
    var screen = document.getElementById("victoryScreen");
    var content = document.getElementById("victoryContent");
    if(!screen || !content) return;

    var html = '<div class="victoryRow">经验 <span class="victoryNum">+' + exp + '</span></div>';
    if(lootName){
        html += '<div class="victoryRow">战利品 <span class="victoryLoot">' + lootName + '</span></div>';
    }else{
        html += '<div class="victoryRow victoryEmpty">无掉落</div>';
    }
    content.innerHTML = html;

    screen.style.display = "flex";
    screen.classList.remove("victoryAnim");
    void screen.offsetWidth;
    screen.classList.add("victoryAnim");

    if(typeof playHealSound === "function") playHealSound();

    setTimeout(function(){
        screen.style.display = "none";
        screen.classList.remove("victoryAnim");
        battleUI.style.display = "none";
        hideMokuDialog();
        player.statuses = {};
        playerExtraTurn = false;
        
        // 【核心修复】彻底清理战斗状态，解开所有锁
        battleActive = false;
        actionLock = false;
        enableActionButtons(true);
        updateBattleUI();
        refreshAccessoryUI();
    }, 2200);
}

function endBattle(win){
    if (!battleActive) return; 
    battleActive = false;
    actionLock = false; // 【修复】强制重置操作锁
    enableActionButtons(false);

    try {
        if(win){
            // 经验计算
            var expGain = 0;
            for(var ei = 0; ei < currentEnemies.length; ei++){
                expGain += Math.floor(currentEnemies[ei].maxHp / 2);
            }
            gainExp(expGain);
            msgBox.innerText += "\n获得 " + expGain + " 经验。";
            
            // 战利品
            var loot = rollLoot();
            var lootName = loot ? loot.name : null;
            if(loot){
                inventory.push(loot);
            }
            // 显示胜利画面
            showVictoryScreen(expGain, lootName);
        }else{
            // 玩家战败
            if(reviveCount > 0){
                reviveCount--;
                msgBox.innerText += "\n你倒下了……【重生】剩余 " + reviveCount + " 次。";
                showMokuDialog("hurtPlayer");
                setTimeout(function(){
                    player.hp = player.maxHp;
                    player.statuses = {};
                    playerExtraTurn = false;
                    battleUI.style.display = "none";
                    hideMokuDialog();
                    updateBattleUI();
                    refreshAccessoryUI();
                    battleActive = false;
                    actionLock = false;
                    enableActionButtons(true);
                }, 1400);
            }else{
                msgBox.innerText += "\n重生次数已用尽……一切归零，失去意识";
                setTimeout(function(){
                    reviveCount = MAX_REVIVE;
                    player.hp = player.maxHp;
                    player.x = TILE * 3;
                    player.y = TILE * 3;
                    player.statuses = {};
                    playerExtraTurn = false;
                    battleUI.style.display = "none";
                    hideMokuDialog();
                    updateBattleUI();
                    refreshAccessoryUI();
                    battleActive = false;
                    actionLock = false;
                    enableActionButtons(true);
                }, 2000);
            }
        }
    } catch(e) {
        console.error("战斗结束崩溃，强制重置界面:", e);
        // 【终极兜底】即使上面全报错，这里也必须把界面关掉，保证能接着玩
        battleUI.style.display = "none";
        battleActive = false;
        actionLock = false;
        enableActionButtons(true);
        updateBattleUI();
    }
}

   主循环

let lastT = performance.now();
function loop(t){
    const dt = Math.min(0.05, (t - lastT) / 1000);
    lastT = t;
    // 致幻特效显示控制
var _hfx = document.getElementById("hallucinationFx");
if(_hfx){
    _hfx.style.display = (battleActive && player.hallucinate) ? "block" : "none";
}

    if(gameStarted && !battleActive){
        player.update(dt);
        moku.update(dt);
        updateMapEnemies(dt);
        refreshTimer -= dt;
if(refreshTimer <= 0){
    refreshTimer = REFRESH_INTERVAL;
    refreshMapContent();
}
        checkMapCollisions();
        updateCamera(player.x, player.y);
        // 漠然气泡
if(mokuBubble.timer > 0){
    mokuBubble.timer -= dt;
}else if(Math.random() < dt * 0.5){
    mokuBubble.text = mokuIdleLines[Math.floor(Math.random() * mokuIdleLines.length)];
    mokuBubble.timer = mokuBubble.maxTime;
}
    }
// 致幻：血条乱跳（战斗中）
if(battleActive && player.hallucinate && Math.random() < 0.15){
    updateEnemyHpBar();
}
    // 渲染
    ctx.fillStyle = "#070709";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if(gameStarted){
        // 地板
        for(let r = 0; r < MAP_ROWS; r++){
            for(let c = 0; c < MAP_COLS; c++){
                const x = c * TILE - cam.x;
                const y = r * TILE - cam.y;
                if(x < -TILE || y < -TILE || x > canvas.width || y > canvas.height) continue;
                if(map[r][c] === 1){
                    ctx.fillStyle = "#1a1a22";
                    ctx.fillRect(x, y, TILE, TILE);
                    ctx.fillStyle = "#25252f";
                    ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
                }else{
                    ctx.fillStyle = ((r + c) % 2 === 0) ? "#101018" : "#0c0c14";
                    ctx.fillRect(x, y, TILE, TILE);
                }
            }
        }

        // 宝箱、事件点
        chestList.forEach(drawChest);
        eventList.forEach(drawEventPoint);

        // 敌人
        mapEnemies.forEach(drawMapEnemy);

        // 角色
        moku.draw();
        if(mokuBubble.timer > 0){
    drawMokuBubble(moku.x - cam.x, moku.y - cam.y);
}
        player.draw();
    }

    // Toast
    if(toastTimer > 0){
        toastTimer -= dt;
        ctx.save();
        ctx.globalAlpha = Math.min(1, toastTimer);
        ctx.fillStyle = "#0a1020";
        ctx.fillRect(canvas.width/2 - 180, 80, 360, 44);
        ctx.strokeStyle = "#3a6bd8";
        ctx.strokeRect(canvas.width/2 - 180, 80, 360, 44);
        ctx.fillStyle = "#cfe4ff";
        ctx.font = "16px system-ui";
        ctx.textAlign = "center";
        ctx.fillText(toastText, canvas.width/2, 108);
        ctx.restore();
    }

    requestAnimationFrame(loop);
}

var scythe = {
    active: false, phase: "draw",
    lines: [], curLine: null, drawing: false,
    enemy: { x:0, y:0, vx:0, vy:0, r:12 },
    frame: { x:0, y:0, w:0, h:0 },
    hitCount: 0, spaceBreakTriggered: false, totalDamage: 0,
    W:0, H:0, canvas: null, ctx: null,

function startScythe(){
    scythe.active = true;
    scythe.phase = "draw";

    scythe.slashes = []; scythe.particles = [];

    scythe.canvas = cv;

    var w = Math.floor(Math.min(window.innerWidth * 0.92, 560));
    var h = Math.floor(Math.min(window.innerHeight * 0.62, 480));
    cv.width = w; cv.height = h;
    cv.style.width = w + "px";
    cv.style.height = h + "px";
    scythe.W = w; scythe.H = h;

    var m = 16;
    scythe.frame = { x:m, y:m, w:w - m*2, h:h - m*2 };

    document.getElementById("scytheLineCount").innerText = "0";
    document.getElementById("scytheHint").innerText = "在框内划三条线";

    cv.addEventListener("touchstart", scytheTouchStart, { passive: false });
cv.addEventListener("touchmove", scytheTouchMove, { passive: false });
cv.addEventListener("touchend", scytheTouchEnd, { passive: false });
cv.addEventListener("mousedown", scytheMouseDown);
cv.addEventListener("mousemove", scytheMouseMove);
window.addEventListener("mouseup", scytheMouseUp);

    scythe.lastT = performance.now();
    scythe.rafId = requestAnimationFrame(scytheLoop);
}

function scytheLocalPos(e){
    var r = scythe.canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function scytheTouchStart(e){
    e.preventDefault();
    var t = e.touches[0];
    scythePointerDown({ clientX: t.clientX, clientY: t.clientY });
}
function scytheTouchMove(e){
    e.preventDefault();
    var t = e.touches[0];
    scythePointerMove({ clientX: t.clientX, clientY: t.clientY });
}
function scytheTouchEnd(e){
    e.preventDefault();
    scythePointerUp();
}
function scytheMouseDown(e){ scythePointerDown(e); }
function scytheMouseMove(e){ scythePointerMove(e); }
function scytheMouseUp(e){ scythePointerUp(); }

function scythePointerDown(e){
    if(!scythe.active || scythe.phase !== "draw") return;
    if(scythe.lines.length >= 3) return;
    scythe.drawing = true;
    var p = scytheLocalPos(e);
    scythe.curLine = { x1:p.x, y1:p.y, x2:p.x, y2:p.y, hitTime:0 };
}
function scythePointerMove(e){
    if(!scythe.active || scythe.phase !== "draw" || !scythe.drawing) return;
    var p = scytheLocalPos(e);
    if(scythe.curLine){ scythe.curLine.x2 = p.x; scythe.curLine.y2 = p.y; }
}
function scythePointerUp(){
    if(!scythe.active || scythe.phase !== "draw" || !scythe.drawing) return;
    scythe.drawing = false;
    if(scythe.curLine){
        var L = scythe.curLine;
        if(Math.hypot(L.x2-L.x1, L.y2-L.y1) > 20){
            scythe.lines.push(L);
            document.getElementById("scytheLineCount").innerText = scythe.lines.length;
        }
        scythe.curLine = null;
    }
    if(scythe.lines.length >= 3){
        scythe.phase = "wait";
        scythe.phaseT = 0;
        document.getElementById("scytheHint").innerText = "碾碎……";
        var fr = scythe.frame;
        scythe.enemy.x = fr.x + fr.w/2;
        scythe.enemy.y = fr.y + fr.h/2;
        var spd = 340;
        var ang = Math.random() * Math.PI * 2;
        scythe.enemy.vx = Math.cos(ang) * spd;
        scythe.enemy.vy = Math.sin(ang) * spd;
    }
}

function scytheLoop(t){
    if(!scythe.active) return;
    var dt = Math.min(0.05, (t - scythe.lastT)/1000);
    scythe.lastT = t;
    updateScythe(dt);
    drawScythe();
    scythe.rafId = requestAnimationFrame(scytheLoop);
}

function updateScythe(dt){
    if(scythe.shake.active){
        scythe.shake.t -= dt;
        if(scythe.shake.t <= 0) scythe.shake.active = false;
    }
    scythe.phaseT += dt;

    if(scythe.phase === "wait"){
        if(scythe.phaseT >= 0.3){ scythe.phase = "bounce"; scythe.phaseT = 0; }
    }
    else if(scythe.phase === "bounce"){
        var e = scythe.enemy; var fr = scythe.frame;
        e.x += e.vx * dt; e.y += e.vy * dt;
        if(e.x - e.r < fr.x){ e.x = fr.x + e.r; e.vx = Math.abs(e.vx); }
        if(e.x + e.r > fr.x + fr.w){ e.x = fr.x + fr.w - e.r; e.vx = -Math.abs(e.vx); }
        if(e.y - e.r < fr.y){ e.y = fr.y + e.r; e.vy = Math.abs(e.vy); }
        if(e.y + e.r > fr.y + fr.h){ e.y = fr.y + fr.h - e.r; e.vy = -Math.abs(e.vy); }

        for(var i = 0; i < scythe.lines.length; i++){
            var L = scythe.lines[i];
            if(L.hitTime > 0) continue;
            var d = distToSegment(e.x, e.y, L.x1, L.y1, L.x2, L.y2);
            if(d < e.r + 4){
                onLineHit(L, i);
                if(scythe.spaceBreakTriggered) return;
            }
        }
        if(scythe.phaseT > 5) endScythe();
    }
    else if(scythe.phase === "spaceBreak"){
        if(scythe.phaseT > 1.6) endScythe();
    }

    for(var i = scythe.slashes.length - 1; i >= 0; i--){
        scythe.slashes[i].life -= dt;
        if(scythe.slashes[i].life <= 0) scythe.slashes.splice(i, 1);
    }
    for(var i = scythe.particles.length - 1; i >= 0; i--){
        var p = scythe.particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vy += 400 * dt; p.life -= dt;
        if(p.life <= 0) scythe.particles.splice(i, 1);
    }
}

function distToSegment(px, py, x1, y1, x2, y2){
    var dx = x2 - x1, dy = y2 - y1;
    var len2 = dx*dx + dy*dy;
    if(len2 === 0) return Math.hypot(px-x1, py-y1);
    var t = ((px-x1)*dx + (py-y1)*dy) / len2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
}

function onLineHit(line, idx){
    var now = performance.now();
    line.hitTime = now;
    scythe.hitCount++;

    var trigger = false;
    for(var i = 0; i < scythe.lines.length; i++){
        if(i === idx) continue;
        var other = scythe.lines[i];
        if(other.hitTime > 0 && Math.abs(other.hitTime - now) < 200){
            trigger = true; break;
        }
    }

    var rate = getCritRate();
    var isCrit = Math.random() < Math.min(rate, 1);
    var overflow = Math.max(0, rate - 1);
    var dmg = 35;
    if(isCrit) dmg *= (1.5 + overflow);
    dmg *= (1 + getAccSum("dmgBonus"));
    if(liberationReady) dmg *= 1.2;
    dmg = Math.floor(dmg);
    currentEnemy.hp = Math.max(0, currentEnemy.hp - dmg);
    scythe.totalDamage += dmg;
    updateEnemyHpBar();

    scythe.slashes.push({
        x1: line.x1, y1: line.y1, x2: line.x2, y2: line.y2,
        life: 0.5, maxLife: 0.5
    });
    spawnGlassParticles(scythe.enemy.x, scythe.enemy.y);
    if(typeof playHitSound === "function") playHitSound();
    scythe.shake.active = true; scythe.shake.t = 0.15; scythe.shake.intensity = 6;

    if(isCrit && typeof tryMokuCombo === "function") tryMokuCombo();

    if(trigger && !scythe.spaceBreakTriggered){
        triggerSpaceBreak();
    }else if(!trigger){
        var allHit = true;
        for(var i = 0; i < scythe.lines.length; i++){
            if(scythe.lines[i].hitTime === 0){ allHit = false; break; }
        }
        if(allHit) endScythe();
    }
}

function triggerSpaceBreak(){
    scythe.spaceBreakTriggered = true;
    scythe.phase = "spaceBreak";
    scythe.phaseT = 0;

    var txt = document.getElementById("spaceBreakText");

        updateEnemyHpBar();

        flashScreen(cuts % 2 === 1 ? "screenFlashWhite" : "screenFlashBlack");
        scythe.shake.active = true; var ramp = cuts / 5;
scythe.shake.t = 0.3 + ramp * 0.4;
scythe.shake.intensity = 8 + ramp * 50 + Math.random() * 8;; scythe.shake.intensity = 16;
        spawnGlassParticles(scythe.enemy.x + (Math.random()-0.5)*40, scythe.enemy.y + (Math.random()-0.5)*40);
        if(typeof playHitSound === "function") playHitSound();

        if(currentEnemy.hp <= 0 || cuts >= 5){
            clearInterval(iv);
            setTimeout(function(){
                txt.style.display = "none";
                endScythe();
            }, 500);
        }
    }, 380);

function flashScreen(cls){

function spawnGlassParticles(x, y){
    for(var i = 0; i < 10; i++){
        var ang = Math.random() * Math.PI * 2;
        var spd = 80 + Math.random() * 200;
        scythe.particles.push({
            x:x, y:y,
            vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd - 100,
            life: 0.6 + Math.random()*0.3,
            size: 3 + Math.random()*4
        });
    }
}

    function endScythe(){
    if(!scythe.active) return;
    scythe.active = false;
    cancelAnimationFrame(scythe.rafId);

    var cv = scythe.canvas;
    cv.removeEventListener("touchstart", scytheTouchStart);
    cv.removeEventListener("touchmove", scytheTouchMove);
    cv.removeEventListener("touchend", scytheTouchEnd);
    cv.removeEventListener("mousedown", scytheMouseDown);

    if(isAllEnemiesDead()){ endBattle(true); return; }

}

function drawScythe(){
    var c = scythe.ctx;
    if(!c) return;
    var W = scythe.W, H = scythe.H;

    var sx = 0, sy = 0;
    if(scythe.shake.active){
        sx = (Math.random()-0.5) * scythe.shake.intensity;
        sy = (Math.random()-0.5) * scythe.shake.intensity;
    }
    c.setTransform(1,0,0,1,0,0);
    c.clearRect(0,0,W,H);
    c.fillStyle = "#080c16";
    c.fillRect(0,0,W,H);
    c.translate(sx, sy);

    var fr = scythe.frame;
    c.strokeStyle = "#6ad8ff"; c.lineWidth = 2;
    c.shadowColor = "#2a5a8a"; c.shadowBlur = 14;
    c.strokeRect(fr.x, fr.y, fr.w, fr.h);
    c.shadowBlur = 0;

    c.strokeStyle = "rgba(60,100,160,0.12)"; c.lineWidth = 1;
    for(var x = fr.x; x < fr.x + fr.w; x += 40){
        c.beginPath(); c.moveTo(x, fr.y); c.lineTo(x, fr.y+fr.h); c.stroke();
    }
    for(var y = fr.y; y < fr.y + fr.h; y += 40){
        c.beginPath(); c.moveTo(fr.x, y); c.lineTo(fr.x+fr.w, y); c.stroke();
    }

    for(var i = 0; i < scythe.lines.length; i++){
        var L = scythe.lines[i];
        var alpha = L.hitTime > 0 ? 0.25 : 1;
        c.strokeStyle = "rgba(200,220,255," + alpha + ")";
        c.lineWidth = 3; c.lineCap = "round";
        c.shadowColor = "#9fe8ff"; c.shadowBlur = 10;
        c.beginPath(); c.moveTo(L.x1, L.y1); c.lineTo(L.x2, L.y2); c.stroke();
        c.shadowBlur = 0;
    }
    if(scythe.curLine){
        var CL = scythe.curLine;
        c.strokeStyle = "rgba(255,220,150,0.9)"; c.lineWidth = 3;
        c.beginPath(); c.moveTo(CL.x1, CL.y1); c.lineTo(CL.x2, CL.y2); c.stroke();
    }

    if(scythe.phase !== "draw"){
        var e = scythe.enemy;
        var grad = c.createRadialGradient(e.x, e.y, 2, e.x, e.y, e.r + 6);
        grad.addColorStop(0, "#ffffff");
        grad.addColorStop(0.4, "#6ad8ff");
        grad.addColorStop(1, "rgba(30,60,120,0)");
        c.fillStyle = grad;
        c.beginPath(); c.arc(e.x, e.y, e.r + 6, 0, Math.PI*2); c.fill();
        c.fillStyle = "#4a1a7a";
        c.beginPath(); c.arc(e.x, e.y, e.r * 0.6, 0, Math.PI*2); c.fill();
    }

    for(var i = 0; i < scythe.slashes.length; i++){
    var s = scythe.slashes[i];
    var k = s.life / s.maxLife;
    var dx = s.x2 - s.x1;
    var dy = s.y2 - s.y1;
    var len = Math.hypot(dx, dy);
    if(len > 0){
        var ex = dx / len * W * 2;
        var ey = dy / len * W * 2;
        // 暗蓝色贯穿斩
        c.save();
        c.globalAlpha = k * 0.85;
        c.strokeStyle = "#1a3a8a";
        c.lineWidth = 14 * k + 3;
        c.shadowColor = "#3a6bd8"; c.shadowBlur = 30;
        c.lineCap = "round";
        c.beginPath();
        c.moveTo(s.x1 - ex, s.y1 - ey);
        c.lineTo(s.x1 + ex, s.y1 + ey);
        c.stroke();
        c.restore();
    }
    // 白色核心
    c.save();
    c.globalAlpha = k;
    c.strokeStyle = "#ffffff";
    c.lineWidth = 8 * k + 2;
    c.shadowColor = "#fff"; c.shadowBlur = 24;
    c.lineCap = "round";
    c.beginPath(); c.moveTo(s.x1, s.y1); c.lineTo(s.x2, s.y2); c.stroke();
    c.restore();
}

    for(var i = 0; i < scythe.particles.length; i++){
        var p = scythe.particles[i];
        c.save();
        c.globalAlpha = Math.min(1, p.life * 2);
        c.fillStyle = "#cfe8ff";
        c.translate(p.x, p.y);
        c.rotate(p.life * 8);
        c.fillRect(-p.size/2, -p.size/2, p.size, p.size);
        c.restore();
    }
    c.setTransform(1,0,0,1,0,0);
}
